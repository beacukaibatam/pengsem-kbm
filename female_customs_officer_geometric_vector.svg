<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" style="background:#FFFFFF;">
    <!-- DEFINITIONS & STYLES -->
    <defs>
        <!-- Gold Gradient for Badges -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFDF00"/>
            <stop offset="100%" stop-color="#D4AF37"/>
        </linearGradient>
    </defs>

    <!-- 1. BODY & TORSO (Dark Navy Uniform) -->
    <!-- Torso Base -->
    <polygon points="190,430 410,430 430,780 170,780" fill="#002244"/>

    <!-- Inner Placket & Buttons -->
    <line x1="300" y1="430" x2="300" y2="780" stroke="#001830" stroke-width="4"/>
    <circle cx="300" cy="520" r="4" fill="#D4AF37"/>
    <circle cx="300" cy="580" r="4" fill="#D4AF37"/>
    <circle cx="300" cy="640" r="4" fill="#D4AF37"/>
    <circle cx="300" cy="700" r="4" fill="#D4AF37"/>

    <!-- Chest Pockets (Flat geometric) -->
    <!-- Right Pocket (Viewer Left) -->
    <polygon points="215,485 275,485 275,555 245,570 215,555" fill="#002D59" stroke="#001F3F" stroke-width="2"/>
    <polygon points="215,485 275,485 275,498 245,508 215,498" fill="#001830"/>
    <circle cx="245" cy="502" r="2.5" fill="#D4AF37"/>

    <!-- Left Pocket (Viewer Right) -->
    <polygon points="325,485 385,485 385,555 355,570 325,555" fill="#002D59" stroke="#001F3F" stroke-width="2"/>
    <polygon points="325,485 385,485 385,498 355,508 325,498" fill="#001830"/>
    <circle cx="355" cy="502" r="2.5" fill="#D4AF37"/>

    <!-- 2. COLLAR & TIE -->
    <!-- White Inner Collar Shirt -->
    <polygon points="270,340 300,385 280,430 250,400" fill="#FFFFFF"/>
    <polygon points="330,340 300,385 320,430 350,400" fill="#FFFFFF"/>
    <!-- Navy Uniform Collar Lapels -->
    <polygon points="245,395 300,435 275,445 230,405" fill="#001F3F"/>
    <polygon points="355,395 300,435 325,445 370,405" fill="#001F3F"/>
    <!-- Dark Navy Silk Tie -->
    <polygon points="292,390 308,390 312,490 300,510 288,490" fill="#001528"/>

    <!-- 3. SHOULDERS & EPAULETS (PANGKAT 3 GARIS PUTIH) -->
    <!-- Left Shoulder / Epaulet (Viewer Left) -->
    <polygon points="175,410 235,395 242,422 182,437" fill="#001528"/>
    <!-- 3 Garis Putih Pangkat -->
    <line x1="192" y1="410" x2="198" y2="432" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="206" y1="407" x2="212" y2="429" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="220" y1="404" x2="226" y2="426" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="236" cy="409" r="3" fill="#D4AF37"/>

    <!-- Right Shoulder / Epaulet (Viewer Right) -->
    <polygon points="425,410 365,395 358,422 418,437" fill="#001528"/>
    <!-- 3 Garis Putih Pangkat -->
    <line x1="408" y1="410" x2="402" y2="432" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="394" y1="407" x2="388" y2="429" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="380" y1="404" x2="374" y2="426" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="364" cy="409" r="3" fill="#D4AF37"/>

    <!-- 4. INSIGNIA & BADGES -->
    <!-- Right Chest (Viewer Left): "BATAM" Name/Location Tag -->
    <rect x="220" y="460" width="50" height="15" rx="2" fill="#001220" stroke="#D4AF37" stroke-width="1.2"/>
    <text x="245" y="471.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8.5" fill="#FFDF00" text-anchor="middle" letter-spacing="1">BATAM</text>

    <!-- Left Chest (Viewer Right): Perisai Emas Bea Cukai & "CUSTOMS EXCISE" -->
    <!-- Gold Perisai / Shield -->
    <polygon points="340,438 370,438 373,446 370,466 355,476 340,466 337,446" fill="#FFDF00" stroke="#B8860B" stroke-width="1.5"/>
    <polygon points="343,442 367,442 369,448 367,463 355,472 343,463 341,448" fill="#002244"/>
    <!-- Stylized Customs Winged Logo inside Shield -->
    <circle cx="355" cy="455" r="4.5" fill="#FFDF00"/>
    <path d="M346,453 Q351,450 355,453 Q359,450 364,453 L362,456 Q358,454 355,456 Q352,454 348,456 Z" fill="#FFDF00"/>
    <line x1="355" y1="448" x2="355" y2="465" stroke="#FFDF00" stroke-width="1.2"/>
    <path d="M349,465 Q355,469 361,465" stroke="#FFDF00" stroke-width="1" fill="none"/>
    <!-- Text "CUSTOMS EXCISE" below Shield -->
    <text x="355" y="483" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="5" fill="#FFDF00" text-anchor="middle" letter-spacing="0.5">CUSTOMS EXCISE</text>

    <!-- Left Arm Sleeve Patch (Viewer Right): Red, Gold & Navy Patch -->
    <polygon points="418,460 445,468 440,510 415,502" fill="#C0392B"/>
    <polygon points="420,468 442,474 438,504 417,498" fill="#002244" stroke="#FFDF00" stroke-width="1.2"/>
    <circle cx="429" cy="486" r="5" fill="#FFDF00"/>

    <!-- 5. ARMS & HANDS IN ANJALI MUDRA (GREETING GESTURE) -->
    <!-- Left Forearm (Viewer Left) angled towards center -->
    <polygon points="170,460 210,440 270,550 240,575" fill="#002244"/>
    <polygon points="240,575 270,550 275,560 245,585" fill="#001830"/> <!-- Cuff -->

    <!-- Right Forearm (Viewer Right) angled towards center -->
    <polygon points="430,460 390,440 330,550 360,575" fill="#002244"/>
    <polygon points="360,575 330,550 325,560 355,585" fill="#001830"/> <!-- Cuff -->

    <!-- Minimalist Round Gold Watch on Left Wrist (Viewer Right arm) -->
    <rect x="330" y="558" width="18" height="7" rx="2" fill="#B8860B" transform="rotate(-30 339 561)"/>
    <circle cx="339" cy="561" r="5.5" fill="#FFDF00" stroke="#785907" stroke-width="1"/>
    <circle cx="339" cy="561" r="2.5" fill="#FFFFFF"/>

    <!-- Two Hands Pressed Together (Anjali Mudra / Namaste Greeting Gesture) -->
    <!-- Left Hand Palm & Fingers -->
    <path d="M282,570 L292,510 Q296,495 300,490 Q304,495 308,510 L318,570 Q300,595 282,570 Z" fill="#F8C8A0" stroke="#E29F72" stroke-width="1.5"/>
    <!-- Thumbs angled inwards -->
    <path d="M294,545 Q290,535 285,540 Q282,548 290,558 Z" fill="#F8C8A0" stroke="#E29F72" stroke-width="1.2"/>
    <path d="M306,545 Q310,535 315,540 Q318,548 310,558 Z" fill="#F8C8A0" stroke="#E29F72" stroke-width="1.2"/>
    <!-- Center Finger Separation Line -->
    <line x1="300" y1="492" x2="300" y2="575" stroke="#E29F72" stroke-width="1.5"/>

    <!-- 6. NECK & HEAD -->
    <!-- Graceful Neck -->
    <rect x="282" y="310" width="36" height="50" fill="#F3B98E"/>
    <!-- Shadow under chin -->
    <polygon points="282,325 318,325 300,345" fill="#E29F72"/>

    <!-- Shoulder-Length Hair (Back/Side Volume - Flat Geometric Blocks) -->
    <path d="M220,240 C215,360 235,420 265,430 L260,340 Z" fill="#1A1C23"/>
    <path d="M380,240 C385,360 365,420 335,430 L340,340 Z" fill="#1A1C23"/>

    <!-- Face Shape (Soft Hexagonal / Oval Minimalist) -->
    <polygon points="262,210 338,210 350,265 330,325 300,342 270,325 250,265" fill="#FED7AA"/>

    <!-- Ears & Minimalist Gold Stud Earrings -->
    <ellipse cx="250" cy="270" rx="6" ry="10" fill="#FED7AA"/>
    <circle cx="249" cy="276" r="2.5" fill="#FFDF00"/>
    <ellipse cx="350" cy="270" rx="6" ry="10" fill="#FED7AA"/>
    <circle cx="351" cy="276" r="2.5" fill="#FFDF00"/>

    <!-- Facial Features (Minimalist Geometric Vector) -->
    <!-- Eyebrows (Clean dark geometric strokes) -->
    <path d="M268,238 Q280,233 292,238" stroke="#1A1C23" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M308,238 Q320,233 332,238" stroke="#1A1C23" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Almond Eyes (Calm, friendly, professional) -->
    <path d="M268,252 Q280,245 292,252 Q280,259 268,252 Z" fill="#FFFFFF"/>
    <circle cx="280" cy="252" r="4.5" fill="#1A1C23"/>
    <circle cx="282" cy="250" r="1.5" fill="#FFFFFF"/>
    <!-- Lash line -->
    <path d="M266,251 Q280,243 294,251" stroke="#1A1C23" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <path d="M308,252 Q320,245 332,252 Q320,259 308,252 Z" fill="#FFFFFF"/>
    <circle cx="320" cy="252" r="4.5" fill="#1A1C23"/>
    <circle cx="322" cy="250" r="1.5" fill="#FFFFFF"/>
    <!-- Lash line -->
    <path d="M306,251 Q320,243 334,251" stroke="#1A1C23" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Nose (Minimal geometric shadow bridge & tip) -->
    <path d="M300,250 L297,276 L304,277" stroke="#E29F72" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cheeks (Subtle healthy peach blush) -->
    <ellipse cx="270" cy="282" rx="9" ry="5" fill="#F87171" opacity="0.3"/>
    <ellipse cx="330" cy="282" rx="9" ry="5" fill="#F87171" opacity="0.3"/>

    <!-- Warm, Friendly Smile with Coral-Pink Lips -->
    <path d="M285,296 Q300,292 315,296 Q300,314 285,296 Z" fill="#F43F5E"/>
    <!-- Inner Teeth Highlight -->
    <path d="M288,297 Q300,295 312,297 Q300,305 288,297 Z" fill="#FFFFFF"/>
    <!-- Upper lip line -->
    <path d="M284,295 Q293,292 300,294 Q307,292 316,295" stroke="#BE123C" stroke-width="1.2" fill="none"/>

    <!-- Hair (Front Bangs & Framing - Crisp Flat Geometric Volume) -->
    <path d="M245,230 C255,160 345,160 355,230 C340,215 315,220 300,228 C285,220 260,215 245,230 Z" fill="#1A1C23"/>
    <!-- Side Fringe Highlights -->
    <polygon points="252,225 264,255 258,255 248,228" fill="#2D3139"/>
    <polygon points="348,225 336,255 342,255 352,228" fill="#2D3139"/>

</svg>
